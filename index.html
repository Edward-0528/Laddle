<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />

    <!-- Primary Meta Tags -->
    <title>PopPop! - Interactive Quiz Platform</title>
    <meta name="title" content="PopPop! - Interactive Quiz Platform" />
    <meta name="description" content="Host live trivia nights in seconds. Ready-made packs for pub quizzes, parties and Christmas, played on everyone's phones with no app." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PopPop! - Interactive Quiz Platform" />
    <meta property="og:description" content="Create, share, and play real-time quizzes with live leaderboards." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="PopPop! - Interactive Quiz Platform" />
    <meta property="twitter:description" content="Create, share, and play real-time quizzes with live leaderboards." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#FFF4E0" />

    <div id="root"></div>
